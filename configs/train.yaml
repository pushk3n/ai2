seed: 42
run_dir: runs/icfie_yolo
hyp_path: yolov7/data/hyp.scratch.p5.yaml
project_after_fusion: true
save_every: 1
use_ota_loss: false
cache_images: false
rect: false
dataset:
  train_path: /home/pushk3n/github-ai2/data/Exdark/train.txt
  val_path: /home/pushk3n/github-ai2/data/Exdark/val.txt
  num_classes: 12
  class_names:
  - Bicycle
  - Boat
  - Bottle
  - Bus
  - Car
  - Cat
  - Chair
  - Cup
  - Dog
  - Motorbike
  - People
  - Table
  image_size: 416
  single_cls: false
yolo:
  cfg_path: yolov7/cfg/training/yolov7.yaml
  weights_path: yolov7/yolov7.pt
hardware:
  device: cuda:0
  use_amp: true
  batch_size: 4
  accumulate_steps: 4
  num_workers: 4
  pin_memory: true
  ddp: false
  use_grad_checkpoint: true
optimizer:
  lr: 0.01
  min_lr: 1.0e-05
  weight_decay: 0.0005
  beta1: 0.937
  beta2: 0.999
schedule:
  stage_b_epochs: 1
  stage_c_epochs: 1
